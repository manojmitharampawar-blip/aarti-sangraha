name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test

      - name: Build with Next.js
        env:
          NEXT_PUBLIC_BASE_PATH: "aarti-sangraha"
        run: npx next build

      - name: Ensure .nojekyll
        run: touch ./out/.nojekyll

      # 1. Deploy to gh-pages branch (works seamlessly with Branch-based GitHub Pages)
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out

      # 2. Upload Pages Artifact (for GitHub Actions Pages source)
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
        continue-on-error: true

  deploy-actions-pages:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    continue-on-error: true
    steps:
      - name: Deploy to GitHub Actions Pages
        id: deployment
        uses: actions/deploy-pages@v4
